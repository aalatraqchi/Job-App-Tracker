name: job-app-tracker
services:
  database:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: job_app_tracker
      POSTGRES_USER: job_app_tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-database.ps1 first}
    volumes:
      - application-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_app_tracker -d job_app_tracker"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  application-data:
